<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1a0f33" />
  <title>Zombie Defense — Parts of a Circle</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%235b2a86' stroke='%23ffd166' stroke-width='4'/%3E%3Cpath d='M32 32 L32 6 A26 26 0 0 1 56 40 Z' fill='%23ffb347'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div id="stage">
      <div id="world">
        <!-- scenes are injected here by js/scene.js -->
        <div id="grade"></div>
        <div id="alarm-light"></div>
        <div id="vignette"></div>
      </div>
      <div id="flash"></div>
      <div id="hud"></div>
      <div id="banner" class="banner"></div>
      <div id="options"></div>
      <!-- zombie timer meter (ZD.ui.timerShow): face -> red line -> wall -->
      <div id="timer" aria-live="off"></div>
      <!-- run-and-jump controller (js/controls.js): icons only -->
      <div id="controls"></div>
      <div id="lesson" class="overlay" aria-live="polite"></div>
      <div id="intro" class="overlay"></div>
      <div id="title" class="overlay"></div>
      <div id="pause" class="overlay"></div>
      <div id="complete" class="overlay"></div>
      <div id="gameover" class="overlay"></div>
      <!-- loading = the welcome screen: same background and logo, a loading bar
           where the play button appears (see intro.title) -->
      <div id="loader" class="welcome-screen" role="status" aria-live="polite">
        <div class="welcome-logo" aria-hidden="true"></div>
        <div class="welcome-slot">
          <div class="bar"><div></div></div>
          <div class="loader-text" data-i18n="appLoading">Loading...</div>
        </div>
      </div>
    </div>
    <div id="rotate" data-i18n="rotateDevice">Please rotate your device to landscape ↻</div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/libs/gsap.min.js"></script>
  <script src="js/motion.js"></script>
  <script src="assets/build/manifest.js"></script>
  <script src="js/core/util.js"></script>
  <script src="js/config/missions.js"></script>
  <script src="js/core/audio.js"></script>
  <script src="js/core/assets.js"></script>
  <script src="js/core/sprites.js"></script>
  <script src="js/geometry.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/intro.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
